name: Release APK

# Push a tag like v1.3.0 to build the signed APK and publish it as a GitHub release.
# The "Install" button on akashawal.com always downloads the newest release's MoneyTracker.apk.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Needs repo secrets: RELEASE_KEYSTORE_BASE64 (base64 of the .jks), RELEASE_STORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. Without the real key an update would not install over
      # existing installs, so the job stops instead of falling back to the debug key.
      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Release signing secrets are not set"; exit 1; }
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/moneytracker-release.jks
          {
            echo "storeFile=$HOME/.android/moneytracker-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.android/moneytracker-keystore.properties

      - name: Check the tag matches the app version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match versionName $v"; exit 1; }

      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk MoneyTracker.apk
          gh release create "$GITHUB_REF_NAME" MoneyTracker.apk --title "Money Tracker ${GITHUB_REF_NAME#v}" --generate-notes
